name: Process Key
on:
  workflow_dispatch:
    inputs:
      key:
        description: "License key"
        required: true
      uuid:
        description: "Device UUID"
        required: true

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Run verification
        env:
          INPUT_KEY: ${{ inputs.key }}
          INPUT_UUID: ${{ inputs.uuid }}
          KEYS_REPO: ${{ github.repository }}
          KEYS_TOKEN: ${{ secrets.KEYS_TOKEN }}
          RESULTS_REPO: ${{ secrets.RESULTS_REPO }}
          RESULTS_TOKEN: ${{ secrets.RESULTS_TOKEN }}
        run: python process_key.py
